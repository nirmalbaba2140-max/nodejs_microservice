services:

  nosql-db:
    image: mongo:latest
    container_name: nosql-db
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  products:
    build:
      context: ./products
      dockerfile: Dockerfile
    container_name: products
    ports:
      - "8002:8002"
    restart: always
    depends_on:
      - nosql-db
      - rabbitmq
    env_file:
      - ./products/.env.dev
    volumes:
      - ./products:/app/products
      - /app/products/node_modules

  shopping:
    build:
      context: ./shopping
      dockerfile: Dockerfile
    container_name: shopping
    ports:
      - "8003:8003"
    restart: always
    depends_on:
      - nosql-db
      - rabbitmq
    env_file:
      - ./shopping/.env.dev
    volumes:
      - ./shopping:/app/shopping
      - /app/shopping/node_modules

  customer:
    build:
      context: ./customer
      dockerfile: Dockerfile
    container_name: customer
    ports:
      - "8001:8001"
    restart: always
    depends_on:
      - nosql-db
      - rabbitmq
    env_file:
      - ./customer/.env.dev
    volumes:
      - ./customer:/app/customer
      - /app/customer/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    restart: always

  nginx-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: nginx-proxy
    depends_on:
      - frontend
      - products
      - shopping
      - customer
    ports:
      - "8088:80"
    restart: always

volumes:
  mongodb_data: