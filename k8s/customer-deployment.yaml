apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: customer

  template:
    metadata:
      labels:
        app: customer

    spec:
      containers:
        - name: customer

          image: nnirmal24/kubecart-customer:latest

          ports:
            - containerPort: 8001

          env:
            - name: PORT
              value: "8001"

            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGODB_CUSTOMER

            - name: MSG_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MSG_QUEUE_URL

            - name: EXCHANGE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EXCHANGE_NAME

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APP_SECRET